<div style="background-color:#050505; padding:32px 16px; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; margin:0 auto; background-color:#141414; border-radius:16px; overflow:hidden; border:1px solid #2a2a2a;">
    <tr>
      <td style="background-color:#E50914; padding:20px 28px;">
        <span style="color:#ffffff; font-size:12px; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">
          New Portfolio Message
        </span>
      </td>
    </tr>
    <tr>
      <td style="padding:28px;">
        <p style="margin:0 0 20px 0; color:#ffffff; font-size:20px; font-weight:bold;">
          {{firstName}} {{lastName}}
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
          <tr>
            <td style="padding:0 0 4px 0;">
              <span style="color:#E50914; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">Email</span>
            </td>
          </tr>
          <tr>
            <td>
              <a href="mailto:{{email}}" style="color:#ffffff; font-size:14px; text-decoration:none;">{{email}}</a>
            </td>
          </tr>
        </table>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:0 0 8px 0;">
              <span style="color:#E50914; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">Message</span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#0b0b0b; border-radius:10px; padding:16px; border-left:3px solid #E50914;">
              <p style="margin:0; color:#d4d4d4; font-size:14px; line-height:1.6; white-space:pre-wrap;">{{message}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px; border-top:1px solid #2a2a2a;">
        <span style="color:#666666; font-size:11px; letter-spacing:1px;">
          Sent from mohammedrashmin.dev &bull; Portfolio Contact Form
        </span>
      </td>
    </tr>
  </table>
</div>
